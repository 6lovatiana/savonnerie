# =========================================================================
# CONFIGURATION DYNAMIQUE D'AIDER POUR LE PROJET SOCOBIS
# =========================================================================

# Chargement automatique des clés du fichier .env
env-file: .env

# Langue par défaut pour les échanges
chat-language: fr

# Configuration de Git
auto-commits: true
attribute-author: true

# Définition des profils / alias de modèles
# (Vous choisirez le profil au lancement)
alias:
  # Profil local (Gratuit, privé, illimité, sans internet)
  local: ollama/qwen2.5-coder:7b
  
  # Profil Cloud Majeur (Idéal pour lire les 946 scripts SQL d'un coup)
  cloud: gemini/gemini-1.5-pro
  
  # Profil Vitesse (Pour les petites corrections rapides)
  fast: groq/llama3-70b-8192
  
  # Profil Routeur (Pour tester les modèles gratuits d'OpenRouter)
  free-route: openrouter/meta-llama/llama-3-8b-instruct:free
